header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: alibaba

  paths-ignore:
    - '.gitignore'
    - '*.md'
    - '*.yml'
    - '*.yaml'
    - '*.golden'
    - 'LICENSE'
    - 'api/**'
    - 'samples/**'
    - 'docs/**'
    - '.github/**'
    - '.licenserc.yaml'
    - 'helm/**'
    - 'envoy/**'
    - 'istio/**'
    - 'go.mod'
    - 'go.sum'
    - 'docker/**'
    - 'Makefile*'
    - 'script/**'
    - '.gitmodules'
    - 'plugins/**'
    - 'CODEOWNERS'
    - 'VERSION'
    - 'DEP_VERSION'
    - 'tools/'
    - 'test/README.md'
    - 'test/README_CN.md'
    - 'test/gateway/reports/**'
    - 'test/inference-extension/reports/**'
    - 'hgctl/cmd/hgctl/config/testdata/config'
    # Generated verification evidence has no source-code license header.
    - 'hgctl/pkg/plugin/build/testdata/SHA256SUMS'
    - 'hgctl/pkg/plugin/build/testdata/baseline-regression.log'
    - 'hgctl/pkg/plugin/build/testdata/runtime-comparison.json'
    - 'hgctl/pkg/manifests'
    - 'pkg/ingress/kube/gateway/istio/testdata'
    - 'release-notes/**'
    - '.cursor/**'
    - '.claude/**'
    - '.agents/**'
    - '.issue-spec/**'
    - 'issue-spec/**'

  comment: on-failure
dependency:
  files:
    - go.mod
