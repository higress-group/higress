name: "Build and Test Plugins"

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "test/**"
      - "helm/**"
      - "Makefile.core.mk"
      - ".github/workflows/build-and-test-plugin.yaml"
      - "tools/hack/build-wasm-plugins.sh"
  pull_request:
    branches: ["*"]
    paths:
      - "plugins/**"
      - "test/**"
      - "helm/**"
      - "Makefile.core.mk"
      - ".github/workflows/build-and-test-plugin.yaml"
      - "tools/hack/build-wasm-plugins.sh"
  workflow_dispatch: ~

jobs:
  higress-wasmplugin-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # TODO(Xunzhuo): Enable C WASM Filters in CI
        wasmPluginType: [GO, RUST]
    steps:
      - uses: actions/checkout@v4

      - name: Disable containerd image store
        run: |
          sudo bash -c 'cat > /etc/docker/daemon.json << EOF
          {
            "features": {
              "containerd-snapshotter": false
            }
          }
          EOF'
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'

      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: "Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: 1.24
          # setup-go owns the Go module and build cache for this job.
          cache: true

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        if: matrix.wasmPluginType == 'RUST'
      - run: git stash # restore patch

      - name: "Run Ingress WasmPlugins Tests"
        uses: nick-fields/retry@v3
        with:
          # Each attempt repairs only the ephemeral workspace out/ directory,
          # which container builds can leave root-owned. The Go e2e batch is
          # the production catalog set plus manifest-referenced conformance
          # dependencies, including mcp-server and test-redis-inject-spin.
          timeout_minutes: 60
          max_attempts: 2
          retry_on: error
          command: >-
            sudo rm -rf -- "${GITHUB_WORKSPACE:?}/out" &&
            mkdir -p -- "${GITHUB_WORKSPACE:?}/out" &&
            GOPROXY="https://proxy.golang.org,direct"
            PLUGIN_TYPE=${{ matrix.wasmPluginType }}
            PLUGIN_GO_BATCH_SCOPE=e2e
            make higress-wasmplugin-test

  publish:
    runs-on: ubuntu-22.04
    needs: [higress-wasmplugin-test]
    steps:
      - uses: actions/checkout@v4
