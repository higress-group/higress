name: Test-only OAuth V0 Wasm EH Feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oauth-v0-feasibility.yaml'
      - 'plugins/wasm-cpp/tests/oauth_parse_probe/**'
      - 'plugins/wasm-cpp/extensions/hmac_auth/plugin_test.cc'
      - 'tools/hack/oauth-v0/**'
      - 'tools/hack/cpp201-write-runtime-coverage.sh'
      - 'tools/hack/cpp201-run-e2e.sh'

permissions:
  contents: read

concurrency:
  group: oauth-v0-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  probe:
    name: Pinned default versus native-Wasm-EH test probe
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build isolated variants and native probes
        id: build
        continue-on-error: true
        run: bash tools/hack/oauth-v0/build.sh
      - name: Exercise pinned real Envoy and capture feasibility verdict
        if: always()
        run: python3 tools/hack/oauth-v0/runtime.py
      - name: Verify native-outcome coverage small fix
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out/oauth-v0/coverage
          for source in basic_auth bot_detect custom_response hmac_auth jwt_auth key_auth key_rate_limit oauth request_block; do
            printf '%s\tsuccess\n' "$source"
          done > out/oauth-v0/coverage/success.tsv
          bash tools/hack/cpp201-write-runtime-coverage.sh out/oauth-v0/coverage/success.tsv out/oauth-v0/coverage/success.txt
          sed 's/oauth\tsuccess/oauth\tfailure/' out/oauth-v0/coverage/success.tsv > out/oauth-v0/coverage/failure.tsv
          bash tools/hack/cpp201-write-runtime-coverage.sh out/oauth-v0/coverage/failure.tsv out/oauth-v0/coverage/failure.txt
          grep -F 'oauth: accepted-minimum' out/oauth-v0/coverage/success.txt
          grep -F 'oauth: build=passed; native=failed; runtime-e2e=not-run; coverage-gap=native-failed' out/oauth-v0/coverage/failure.txt
          ! grep -E '^oauth:.*accepted' out/oauth-v0/coverage/failure.txt
          head -8 out/oauth-v0/coverage/success.tsv > out/oauth-v0/coverage/missing.tsv
          if bash tools/hack/cpp201-write-runtime-coverage.sh out/oauth-v0/coverage/missing.tsv out/oauth-v0/coverage/missing.txt; then
            exit 1
          fi
          printf 'success-outcome=passed\nfailed-outcome=not-accepted\nmissing-outcome=failed-closed\n' > out/oauth-v0/coverage/summary.txt
      - name: Seal actual evidence hashes
        if: always()
        run: |
          set -euo pipefail
          printf 'run=%s\nattempt=%s\nhead=%s\nrunner=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$EXPECTED_HEAD" "$RUNNER_NAME" > out/oauth-v0/run-identity.txt
          printf 'Only test-only V0 feasibility; production mechanism and QUESTION remain blocked. Non-OCI evidence; no public release.\n' > out/oauth-v0/scope.txt
          find out/oauth-v0 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > out/oauth-v0/SHA256SUMS
      - name: Upload non-OCI probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oauth-v0-${{ github.event.pull_request.head.sha }}
          path: out/oauth-v0
          if-no-files-found: error
          retention-days: 14
      - name: Enforce probe proof without waiving production native gate
        if: always()
        run: |
          set -euo pipefail
          test "$(cat out/oauth-v0/hmac/native.exit)" -eq 0
          test "$(cat out/oauth-v0/native/run.exit)" -eq 0
          python3 -c 'import json; from pathlib import Path; result=json.loads(Path("out/oauth-v0/verdict.json").read_text()); print(result["verdict"]); assert result["verdict"] == "VALIDATED"'
