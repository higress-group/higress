name: Test-only OAuth V1 Paired Diagnostic Contrast

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oauth-v0-feasibility.yaml'
      - 'plugins/wasm-cpp/tests/oauth_parse_probe/**'
      - 'tools/hack/oauth-v0/**'

permissions:
  contents: read

concurrency:
  group: oauth-v1-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  probe:
    name: Pinned diagnostic-on versus diagnostic-off native-Wasm-EH probe
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      OAUTH_PROBE_VERSION: v1
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build the unchanged EH control, paired candidate and native reference
        id: build
        continue-on-error: true
        run: bash tools/hack/oauth-v0/build.sh
      - name: Exercise pinned real Envoy and enforce the V1 diagnostic contract
        if: always()
        run: python3 tools/hack/oauth-v0/runtime_v1.py
      - name: Seal actual evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out/oauth-v1
          printf 'run=%s\njob=%s\nattempt=%s\nhead=%s\nrunner=%s\n' "$GITHUB_RUN_ID" "$GITHUB_JOB" "$GITHUB_RUN_ATTEMPT" "$EXPECTED_HEAD" "$RUNNER_NAME" > out/oauth-v1/run-identity.txt
          printf 'Only test-only V1 paired diagnostic contrast; production mechanism and QUESTION remain blocked. Assertions/debug checks/exception stack diagnostics lost. Non-OCI evidence; no public release.\n' > out/oauth-v1/scope.txt
          find out/oauth-v1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > out/oauth-v1/SHA256SUMS
      - name: Upload non-OCI probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oauth-v1-${{ github.event.pull_request.head.sha }}
          path: out/oauth-v1
          if-no-files-found: error
          retention-days: 14
      - name: Enforce complete V1 proof without waiving any production gate
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.build.outcome }}" = success
          test "$(cat out/oauth-v1/builder.exit)" -eq 0
          test "$(cat out/oauth-v1/native/run.exit)" -eq 0
          python3 -c 'import json; from pathlib import Path; result=json.loads(Path("out/oauth-v1/verdict.json").read_text()); print(result["verdict"]); assert result["verdict"] == "VALIDATED" and result["proof"] and all(result["proof"].values())'
