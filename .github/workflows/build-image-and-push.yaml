name: Build Docker Images and Push to Image Registry

on:
  push:
    tags:
    - "v*.*.*"
  workflow_dispatch: ~

jobs:
  build-controller-image:
    runs-on: ubuntu-latest
    environment:
      name: image-registry-controller
    env:
      CONTROLLER_IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'higress-registry.cn-hangzhou.cr.aliyuncs.com' }}
      CONTROLLER_IMAGE_NAME: ${{ vars.CONTROLLER_IMAGE_NAME || 'higress/higress' }}
    steps:
      - name: "Checkout ${{ github.ref }}"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: "Setup Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Golang Caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |-
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-go

      - name: Calculate Docker metadata
        id: docker-meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5
        with:
          images: |
            ${{ env.CONTROLLER_IMAGE_REGISTRY }}/${{ env.CONTROLLER_IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Login to Docker Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.CONTROLLER_IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image and Push
        run: |
          set -euo pipefail
          release_provenance=false
          version=""
          snapshot_sha=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            snapshot="plugins/release/snapshots/$version.json"
            test -f "$snapshot"
            snapshot_sha=$(sha256sum "$snapshot" | awk '{print $1}')
            release_provenance=true
          fi
          provenance_args=(
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:io.higress.higress-source-commit=$GITHUB_SHA"
            --annotation "index:io.higress.plugin-snapshot-sha256=$snapshot_sha"
            --annotation "index:io.higress.gateway-version=$version"
            --annotation "manifest-descriptor:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "manifest-descriptor:io.higress.higress-source-commit=$GITHUB_SHA"
            --annotation "manifest-descriptor:io.higress.plugin-snapshot-sha256=$snapshot_sha"
            --annotation "manifest-descriptor:io.higress.gateway-version=$version"
          )
          descriptor_or_absent() {
            local ref=$1 out err
            err=$(mktemp)
            if out=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>"$err"); then rm -f "$err"; printf '%s' "$out" | tr -d '"'; return 0; fi
            if grep -Eiq '401|403|unauthorized|forbidden|denied|authentication required|authorization required' "$err"; then cat "$err" >&2; rm -f "$err"; echo "stable image tag lookup was refused; authorization failure is never absence: $ref" >&2; return 2; fi
            if grep -Eiq '404|manifest unknown|name unknown|repository does not exist' "$err" || grep -Fqx "ERROR: $ref: not found" "$err"; then rm -f "$err"; return 1; fi
            cat "$err" >&2; rm -f "$err"; echo "stable image tag lookup failed; refusing mutation: $ref" >&2; return 2
          }
          verify_release_staging() {
            local ref=$1
            docker buildx imagetools inspect "$ref" --raw > /tmp/release-image-index.json
            jq -e --arg commit "$GITHUB_SHA" --arg snapshot "$snapshot_sha" --arg version "$version" '.annotations["org.opencontainers.image.revision"] == $commit and .annotations["io.higress.higress-source-commit"] == $commit and .annotations["io.higress.plugin-snapshot-sha256"] == $snapshot and .annotations["io.higress.gateway-version"] == $version and (.manifests | length == 2) and ([.manifests[] | .platform.os + "/" + .platform.architecture] | sort == ["linux/amd64","linux/arm64"]) and all(.manifests[]; .annotations["org.opencontainers.image.revision"] == $commit and .annotations["io.higress.higress-source-commit"] == $commit and .annotations["io.higress.plugin-snapshot-sha256"] == $snapshot and .annotations["io.higress.gateway-version"] == $version)' /tmp/release-image-index.json >/dev/null
          }
          publish_with_provenance() {
            local source=$1 target=$2
            if [ "$release_provenance" = false ]; then docker buildx imagetools create --tag "$target" "$source"; return; fi
            if [ "$target" = "${target%:*}:$version" ] || [ "$target" = "${target%:*}:v$version" ]; then
              local staging="${target%:*}:release-provenance-$GITHUB_SHA" desired existing
              docker buildx imagetools create "${provenance_args[@]}" --tag "$staging" "$source"
              verify_release_staging "$staging"
              desired=$(descriptor_or_absent "$staging")
              [[ "$desired" =~ ^sha256:[0-9a-f]{64}$ ]]
              if existing=$(descriptor_or_absent "$target"); then
                test "$existing" = "$desired" || { echo "immutable stable image tag conflict: $target" >&2; exit 1; }
                return
              else
                status=$?
                test "$status" = 1 || exit "$status"
              fi
              docker buildx imagetools create --tag "$target" "$staging@$desired"
              test "$(descriptor_or_absent "$target")" = "$desired"
              return
            fi
            docker buildx imagetools create "${provenance_args[@]}" --tag "$target" "$source"
            verify_release_staging "$target"
          }
          BUILT_IMAGE=""
          readarray -t IMAGES <<< "${{ steps.docker-meta.outputs.tags }}"
          for image in ${IMAGES[@]}; do
            echo "Image: $image"
            if [ "$BUILT_IMAGE" == "" ]; then
              build_image="$image"; if [ "$release_provenance" = true ]; then build_image="${image%:*}:release-build-$GITHUB_SHA"; fi
              BUILDX_NO_DEFAULT_ATTESTATIONS=1 GOPROXY="https://proxy.golang.org,direct" IMG_URL="$build_image" make docker-buildx-push
              BUILT_IMAGE="$build_image"
            fi
            publish_with_provenance "$BUILT_IMAGE" "$image"
          done

  build-pilot-image:
    runs-on: ubuntu-latest
    environment:
      name: image-registry-pilot
    env:
      PILOT_IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'higress-registry.cn-hangzhou.cr.aliyuncs.com' }}
      PILOT_IMAGE_NAME: ${{ vars.PILOT_IMAGE_NAME || 'higress/pilot' }}
    steps:
      - name: "Checkout ${{ github.ref }}"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: "Setup Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Golang Caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |-
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-go

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Cache Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Calculate Docker metadata
        id: docker-meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5
        with:
          images: |
            ${{ env.PILOT_IMAGE_REGISTRY }}/${{ env.PILOT_IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Login to Docker Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.PILOT_IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Pilot-Discovery Image and Push
        run: |
          set -euo pipefail
          release_provenance=false; version=""; snapshot_sha=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; snapshot="plugins/release/snapshots/$version.json"; test -f "$snapshot"; snapshot_sha=$(sha256sum "$snapshot" | awk '{print $1}'); release_provenance=true; fi
          provenance_args=(--annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" --annotation "index:io.higress.higress-source-commit=$GITHUB_SHA" --annotation "index:io.higress.plugin-snapshot-sha256=$snapshot_sha" --annotation "index:io.higress.gateway-version=$version" --annotation "manifest-descriptor:org.opencontainers.image.revision=$GITHUB_SHA" --annotation "manifest-descriptor:io.higress.higress-source-commit=$GITHUB_SHA" --annotation "manifest-descriptor:io.higress.plugin-snapshot-sha256=$snapshot_sha" --annotation "manifest-descriptor:io.higress.gateway-version=$version")
          descriptor_or_absent() { local ref=$1 out err; err=$(mktemp); if out=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>"$err"); then rm -f "$err"; printf '%s' "$out" | tr -d '"'; return 0; fi; if grep -Eiq '401|403|unauthorized|forbidden|denied|authentication required|authorization required' "$err"; then cat "$err" >&2; rm -f "$err"; echo "stable image tag lookup was refused; authorization failure is never absence: $ref" >&2; return 2; fi; if grep -Eiq '404|manifest unknown|name unknown|repository does not exist' "$err" || grep -Fqx "ERROR: $ref: not found" "$err"; then rm -f "$err"; return 1; fi; cat "$err" >&2; rm -f "$err"; echo "stable image tag lookup failed; refusing mutation: $ref" >&2; return 2; }
          verify_release_staging() { local ref=$1; docker buildx imagetools inspect "$ref" --raw >/tmp/release-image-index.json; jq -e --arg commit "$GITHUB_SHA" --arg snapshot "$snapshot_sha" --arg version "$version" '.annotations["org.opencontainers.image.revision"] == $commit and .annotations["io.higress.higress-source-commit"] == $commit and .annotations["io.higress.plugin-snapshot-sha256"] == $snapshot and .annotations["io.higress.gateway-version"] == $version and (.manifests | length == 2) and ([.manifests[] | .platform.os + "/" + .platform.architecture] | sort == ["linux/amd64","linux/arm64"]) and all(.manifests[]; .annotations["org.opencontainers.image.revision"] == $commit and .annotations["io.higress.higress-source-commit"] == $commit and .annotations["io.higress.plugin-snapshot-sha256"] == $snapshot and .annotations["io.higress.gateway-version"] == $version)' /tmp/release-image-index.json >/dev/null; }
          publish_with_provenance() { local source=$1 target=$2; if [ "$release_provenance" = false ]; then docker buildx imagetools create --tag "$target" "$source"; return; fi; if [ "$target" = "${target%:*}:$version" ] || [ "$target" = "${target%:*}:v$version" ]; then local staging="${target%:*}:release-provenance-$GITHUB_SHA" desired existing; docker buildx imagetools create "${provenance_args[@]}" --tag "$staging" "$source"; verify_release_staging "$staging"; desired=$(descriptor_or_absent "$staging"); [[ "$desired" =~ ^sha256:[0-9a-f]{64}$ ]]; if existing=$(descriptor_or_absent "$target"); then test "$existing" = "$desired" || { echo "immutable stable image tag conflict: $target" >&2; exit 1; }; return; else status=$?; test "$status" = 1 || exit "$status"; fi; docker buildx imagetools create --tag "$target" "$staging@$desired"; test "$(descriptor_or_absent "$target")" = "$desired"; return; fi; docker buildx imagetools create "${provenance_args[@]}" --tag "$target" "$source"; verify_release_staging "$target"; }
          BUILT_IMAGE=""
          readarray -t IMAGES <<< "${{ steps.docker-meta.outputs.tags }}"
          for image in ${IMAGES[@]}; do
            echo "Image: $image"
            if [ "$BUILT_IMAGE" == "" ]; then
              TAG=${image#*:}
              HUB=${image%:*}
              HUB=${HUB%/*}
              BUILT_IMAGE="$HUB/pilot:$TAG"; if [ "$release_provenance" = true ]; then BUILT_IMAGE="$HUB/pilot:release-build-$GITHUB_SHA"; fi
              BUILDX_NO_DEFAULT_ATTESTATIONS=1 GOPROXY="https://proxy.golang.org,direct" IMG_URL="$BUILT_IMAGE" make build-istio
            fi
            publish_with_provenance "$BUILT_IMAGE" "$image"
          done

  build-gateway-image:
    runs-on: ubuntu-latest
    environment:
      name: image-registry-gateway
    env:
      GATEWAY_IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'higress-registry.cn-hangzhou.cr.aliyuncs.com' }}
      GATEWAY_IMAGE_NAME: ${{ vars.GATEWAY_IMAGE_NAME || 'higress/gateway' }}
    steps:
      - name: "Checkout ${{ github.ref }}"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: "Setup Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Golang Caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |-
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-go

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Cache Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Calculate Docker metadata
        id: docker-meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5
        with:
          images: |
            ${{ env.GATEWAY_IMAGE_REGISTRY }}/${{ env.GATEWAY_IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Login to Docker Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GATEWAY_IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Gateway Image and Push
        run: |
          set -euo pipefail
          release_provenance=false; version=""; snapshot_sha=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; snapshot="plugins/release/snapshots/$version.json"; test -f "$snapshot"; snapshot_sha=$(sha256sum "$snapshot" | awk '{print $1}'); release_provenance=true; fi
          provenance_args=(--annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" --annotation "index:io.higress.higress-source-commit=$GITHUB_SHA" --annotation "index:io.higress.plugin-snapshot-sha256=$snapshot_sha" --annotation "index:io.higress.gateway-version=$version" --annotation "manifest-descriptor:org.opencontainers.image.revision=$GITHUB_SHA" --annotation "manifest-descriptor:io.higress.higress-source-commit=$GITHUB_SHA" --annotation "manifest-descriptor:io.higress.plugin-snapshot-sha256=$snapshot_sha" --annotation "manifest-descriptor:io.higress.gateway-version=$version")
          descriptor_or_absent() { local ref=$1 out err; err=$(mktemp); if out=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>"$err"); then rm -f "$err"; printf '%s' "$out" | tr -d '"'; return 0; fi; if grep -Eiq '401|403|unauthorized|forbidden|denied|authentication required|authorization required' "$err"; then cat "$err" >&2; rm -f "$err"; echo "stable image tag lookup was refused; authorization failure is never absence: $ref" >&2; return 2; fi; if grep -Eiq '404|manifest unknown|name unknown|repository does not exist' "$err" || grep -Fqx "ERROR: $ref: not found" "$err"; then rm -f "$err"; return 1; fi; cat "$err" >&2; rm -f "$err"; echo "stable image tag lookup failed; refusing mutation: $ref" >&2; return 2; }
          verify_release_staging() { local ref=$1; docker buildx imagetools inspect "$ref" --raw >/tmp/release-image-index.json; jq -e --arg commit "$GITHUB_SHA" --arg snapshot "$snapshot_sha" --arg version "$version" '.annotations["org.opencontainers.image.revision"] == $commit and .annotations["io.higress.higress-source-commit"] == $commit and .annotations["io.higress.plugin-snapshot-sha256"] == $snapshot and .annotations["io.higress.gateway-version"] == $version and (.manifests | length == 2) and ([.manifests[] | .platform.os + "/" + .platform.architecture] | sort == ["linux/amd64","linux/arm64"]) and all(.manifests[]; .annotations["org.opencontainers.image.revision"] == $commit and .annotations["io.higress.higress-source-commit"] == $commit and .annotations["io.higress.plugin-snapshot-sha256"] == $snapshot and .annotations["io.higress.gateway-version"] == $version)' /tmp/release-image-index.json >/dev/null; }
          publish_with_provenance() { local source=$1 target=$2; if [ "$release_provenance" = false ]; then docker buildx imagetools create --tag "$target" "$source"; return; fi; if [ "$target" = "${target%:*}:$version" ] || [ "$target" = "${target%:*}:v$version" ]; then local staging="${target%:*}:release-provenance-$GITHUB_SHA" desired existing; docker buildx imagetools create "${provenance_args[@]}" --tag "$staging" "$source"; verify_release_staging "$staging"; desired=$(descriptor_or_absent "$staging"); [[ "$desired" =~ ^sha256:[0-9a-f]{64}$ ]]; if existing=$(descriptor_or_absent "$target"); then test "$existing" = "$desired" || { echo "immutable stable image tag conflict: $target" >&2; exit 1; }; return; else status=$?; test "$status" = 1 || exit "$status"; fi; docker buildx imagetools create --tag "$target" "$staging@$desired"; test "$(descriptor_or_absent "$target")" = "$desired"; return; fi; docker buildx imagetools create "${provenance_args[@]}" --tag "$target" "$source"; verify_release_staging "$target"; }
          BUILT_IMAGE=""
          readarray -t IMAGES <<< "${{ steps.docker-meta.outputs.tags }}"
          for image in ${IMAGES[@]}; do
            echo "Image: $image"
            if [ "$BUILT_IMAGE" == "" ]; then
              TAG=${image#*:}
              HUB=${image%:*}
              HUB=${HUB%/*}
              BUILT_IMAGE="$HUB/proxyv2:$TAG"; if [ "$release_provenance" = true ]; then BUILT_IMAGE="$HUB/proxyv2:release-build-$GITHUB_SHA"; fi
              BUILDX_NO_DEFAULT_ATTESTATIONS=1 GOPROXY="https://proxy.golang.org,direct" IMG_URL="$BUILT_IMAGE" make build-gateway
            fi
            publish_with_provenance "$BUILT_IMAGE" "$image"
          done

          # Keep the historical numeric proxyv2 tag as a compatibility alias.
          # The alias is copied from the verified gateway stable index, never
          # from the unverified build intermediary, and immutable conflicts
          # fail closed.
          # BEGIN gateway-proxyv2-compatibility-contract
          if [ "$release_provenance" = true ]; then
            gateway_stable="${IMAGES[0]%:*}:$version"
            proxyv2_stable="${BUILT_IMAGE%:*}:$version"
            desired=$(descriptor_or_absent "$gateway_stable")
            [[ "$desired" =~ ^sha256:[0-9a-f]{64}$ ]]
            if existing=$(descriptor_or_absent "$proxyv2_stable"); then
              test "$existing" = "$desired" || { echo "immutable proxyv2 compatibility tag conflict: $proxyv2_stable" >&2; exit 1; }
            else
              status=$?
              test "$status" = 1 || exit "$status"
              docker buildx imagetools create --tag "$proxyv2_stable" "$gateway_stable@$desired"
              test "$(descriptor_or_absent "$proxyv2_stable")" = "$desired"
            fi
          fi
          # END gateway-proxyv2-compatibility-contract
