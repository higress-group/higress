apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  redis-stack.conf: |
    {{- if .Values.redis.password }}
    requirepass {{ .Values.redis.password }}
    {{- end }}
    {{- if .Values.redis.persistence.enabled }}
    {{- if or .Values.redis.aof.enabled .Values.redis.rdb.enabled }}
    dir /data
    {{- end }}
    {{- if .Values.redis.aof.enabled }}
    {{- if not (or (eq .Values.redis.aof.fsync "always") (eq .Values.redis.aof.fsync "everysec") (eq .Values.redis.aof.fsync "no")) }}
    {{- fail (printf "redis.aof.fsync must be one of: always, everysec, no (got: %q)" .Values.redis.aof.fsync) }}
    {{- end }}
    appendonly yes
    appendfsync {{ .Values.redis.aof.fsync }}
    auto-aof-rewrite-percentage {{ .Values.redis.aof.rewritePercentage }}
    auto-aof-rewrite-min-size {{ .Values.redis.aof.rewriteMinSize }}
    {{- end }}
    {{- if .Values.redis.rdb.enabled }}
    {{- if eq (len .Values.redis.rdb.save) 0 }}
    save ""
    {{- else }}
    {{- range .Values.redis.rdb.save }}
    save {{ . }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.redis.extraConfig -}}
    {{- .Values.redis.extraConfig | nindent 4 }}
    {{- end }}
