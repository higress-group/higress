# Dedicated ephemeral Redis for this test.
# Authentication/reconnection is outside this quota-behavior fixture.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-quota-redis
  namespace: higress-conformance-ai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-quota-redis
  template:
    metadata:
      labels:
        app: ai-quota-redis
    spec:
      containers:
        - name: redis
          image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/redis-stack-server:7.4.0-v3
          command: ["/usr/bin/redis-server"]
          args: ["--save", "", "--appendonly", "no", "--protected-mode", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-quota-redis
  namespace: higress-conformance-ai-backend
spec:
  selector:
    app: ai-quota-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    higress.io/upstream-vhost: generativelanguage.googleapis.com
  name: wasmplugin-ai-quota
  namespace: higress-conformance-ai-backend
spec:
  ingressClassName: higress
  rules:
    - host: ai-quota.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-mock-service
                port:
                  number: 3000
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-quota-key-auth
  namespace: higress-system
spec:
  phase: AUTHN
  priority: 1000
  defaultConfig:
    global_auth: false
    in_header: true
    keys: [x-api-key]
    consumers:
      - name: quota-admin
        credential: quota-admin-key
      - name: quota-user
        credential: quota-user-key
      - name: quota-missing
        credential: quota-missing-key
      - name: quota-other
        credential: quota-other-key
  defaultConfigDisable: false
  matchRules:
    - ingress: [higress-conformance-ai-backend/wasmplugin-ai-quota]
      configDisable: false
      config:
        allow: [quota-admin, quota-user, quota-missing, quota-other]
  url: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/go-key-auth:2.0.0
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-quota
  namespace: higress-system
spec:
  priority: 750
  defaultConfigDisable: true
  matchRules:
    - ingress: [higress-conformance-ai-backend/wasmplugin-ai-quota]
      configDisable: false
      config:
        admin_consumer: quota-admin
        admin_path: /quota
        enable_path_suffixes: [/v1/chat/completions, ':streamGenerateContent']
        redis_key_prefix: "ai-quota-e2e:"
        redis:
          service_name: ai-quota-redis.higress-conformance-ai-backend.svc.cluster.local
          service_port: 6379
          timeout: 2000
  url: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-quota:2.0.2
