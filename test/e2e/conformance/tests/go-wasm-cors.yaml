apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wasmplugin-cors
  namespace: higress-conformance-infra
spec:
  ingressClassName: higress
  rules:
    - host: "cors.example.com"
      http:
        paths:
          - pathType: Prefix
            path: "/foo"
            backend:
              service:
                name: infra-backend-v1
                port:
                  number: 8080
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: cors
  namespace: higress-system
spec:
  defaultConfigDisable: true
  matchRules:
    - config:
        allow_origins:
          - http://cors.example.net
        allow_methods:
          - GET
          - POST
        allow_headers:
          - Content-Type
          - X-Requested-With
        allow_credentials: true
        max_age: 3600
      configDisable: false
      ingress:
        - higress-conformance-infra/wasmplugin-cors
  url: file:///opt/plugins/wasm-go/extensions/cors/plugin.wasm
