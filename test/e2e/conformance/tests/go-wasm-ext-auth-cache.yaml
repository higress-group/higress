# Redis backs the ext-auth auth-result cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-auth-cache-redis
  namespace: higress-conformance-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-auth-cache-redis
  template:
    metadata:
      labels:
        app: ext-auth-cache-redis
    spec:
      containers:
        - name: redis
          image: redis:6.2
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ext-auth-cache-redis
  namespace: higress-conformance-infra
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: ext-auth-cache-redis
---
# The authorization server. forward_auth mode always sends it "GET /uuid", which
# returns a fresh random uuid on every real call. ext-auth maps that uuid into the
# x-auth-uuid upstream header and caches it, so a repeated uuid proves a cache hit
# (the auth server was not called again) and a new uuid proves a miss.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-auth-cache-httpbin
  namespace: higress-conformance-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-auth-cache-httpbin
  template:
    metadata:
      labels:
        app: ext-auth-cache-httpbin
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status/200
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ext-auth-cache-httpbin
  namespace: higress-conformance-infra
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: ext-auth-cache-httpbin
---
# Route exercising the default cache key (method + path + forwarded headers).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ext-auth-cache-default
  namespace: higress-conformance-infra
spec:
  ingressClassName: higress
  rules:
    - host: "ext-auth-cache-default.example.com"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: infra-backend-v1
                port:
                  number: 8080
---
# Route exercising cache.key_fields (method + query-free path + listed fields).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ext-auth-cache-keyfields
  namespace: higress-conformance-infra
spec:
  ingressClassName: higress
  rules:
    - host: "ext-auth-cache-keyfields.example.com"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: infra-backend-v1
                port:
                  number: 8080
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ext-auth-cache
  namespace: higress-system
spec:
  defaultConfigDisable: true
  url: file:///opt/plugins/wasm-go/extensions/ext-auth/plugin.wasm
  matchRules:
    - ingress:
        - higress-conformance-infra/ext-auth-cache-default
      config:
        http_service:
          endpoint_mode: forward_auth
          timeout: 5000
          endpoint:
            service_name: ext-auth-cache-httpbin.higress-conformance-infra.svc.cluster.local
            service_port: 8080
            request_method: GET
            path: /uuid
          authorization_response:
            mapped_upstream_headers:
              - source: body_json
                key: uuid
                to_header: x-auth-uuid
        cache:
          enabled: true
          ttl: 300
          redis:
            service_name: ext-auth-cache-redis.higress-conformance-infra.svc.cluster.local
            service_port: 6379
            timeout: 2000
    - ingress:
        - higress-conformance-infra/ext-auth-cache-keyfields
      config:
        http_service:
          endpoint_mode: forward_auth
          timeout: 5000
          endpoint:
            service_name: ext-auth-cache-httpbin.higress-conformance-infra.svc.cluster.local
            service_port: 8080
            request_method: GET
            path: /uuid
          authorization_response:
            mapped_upstream_headers:
              - source: body_json
                key: uuid
                to_header: x-auth-uuid
        cache:
          enabled: true
          ttl: 300
          key_fields:
            - source: query
              key: userId
            - source: header
              key: x-app-key
          redis:
            service_name: ext-auth-cache-redis.higress-conformance-infra.svc.cluster.local
            service_port: 6379
            timeout: 2000
