apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wasmplugin-a2a-protocol
  namespace: higress-conformance-infra
spec:
  ingressClassName: higress
  rules:
    - host: a2a-protocol.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-backend-v1
                port:
                  number: 8080
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: a2a-protocol
  namespace: higress-system
spec:
  phase: AUTHN
  priority: 300
  defaultConfigDisable: true
  matchRules:
    - ingress:
        - higress-conformance-infra/wasmplugin-a2a-protocol
      configDisable: false
      config:
        protocolVersion: "1.0"
        mode: enforce
        legacy03:
          enabled: false
        agent:
          id: weather-agent
          externalBaseURL: https://a2a-protocol.example.com/a2a
        authorization:
          exposeInternalHeaders: true
  url: file:///opt/plugins/wasm-go/extensions/a2a-protocol/plugin.wasm
