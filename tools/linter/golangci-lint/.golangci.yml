version: "2"
run:
  timeout: 10m
linters:
  enable:
    - bodyclose
    - gocritic
    - goheader
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA1019:'
      - linters:
          - bodyclose
        path: test/e2e
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/alibaba/higress/)
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/alibaba/higress/
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - zz_generated
