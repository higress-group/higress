      - name: agency_id
        description: 匿名机构/大V ID
        type: string
        required: true
        position: path
      - name: end_date
        description: 结束日期
        type: string
        position: query
      - name: limit
        description: 返回条数，默认 250，最大 1000
        type: integer
        position: query
      - name: start_date
        description: 开始日期
        type: string
        position: query
    requestTemplate:
      url: https://lava.ai-dolphin.com/subscribe/v1/agencies/{agency_id}/history
