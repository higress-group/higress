    description: 匿名机构/大V历史截面评分（PIT） - 查某一天当时的机构/大V分（PIT＝只用那天已经知道的数据计算，不会“偷看未来”），适合回测。返回不晚于 as_of_date 的最近一个已发布日期的数据。
