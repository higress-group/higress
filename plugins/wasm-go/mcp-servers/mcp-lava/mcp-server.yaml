server:
  name: lava
  config:
    apiKey: ""
  securitySchemes:
    - id: apiKeyHeader
      type: apiKey
      in: header
      name: X-API-Key
    - id: bearerAuth
      type: http
      scheme: bearer
tools:
  - name: getAccount
    description: 查余额和用量（不扣钱） - 返回余额、单价、预计还能调用几次、今天调用了几次。查这个不扣钱。
    args: []
    requestTemplate:
      url: https://lava.ai-dolphin.com/subscribe/v1/account
      method: GET
      headers:
        - key: X-API-Key
          value: '{{.config.apiKey}}'
    responseTemplate:
      prependBody: |+
        # API Response Information

        Below is the response from an API call. To help you understand the data, I've provided:

        1. A detailed description of all fields in the response structure
        2. The complete API response

        ## Response Structure

        > Content-Type: application/json

        - **code**: 成功为 OK，失败为错误码 (Type: string)
        - **data**: 业务数据；失败时为 null
        - **error**: 失败时的附加细节 (Type: object)
        - **message**:  (Type: string)
        - **meta**:  (Type: object)
          - **meta.api_version**:  (Type: string)
          - **meta.billing**:  (Type: object)
            - **meta.billing.balance_yuan**:  (Type: string)
            - **meta.billing.charged_yuan**:  (Type: string)
          - **meta.request_id**:  (Type: string)
          - **meta.server_time**:  (Type: string)
        - **ok**:  (Type: boolean)

        ## Original Response

    outputSchema:
      description: 成功
      properties:
        code:
          description: 成功为 OK，失败为错误码
          type: string
        data:
          description: 业务数据；失败时为 null
          type: ""
        error:
          description: 失败时的附加细节
          type: object
        message:
          type: string
        meta:
          properties:
            api_version:
              type: string
            billing:
              properties:
                balance_yuan:
                  type: string
                charged_yuan:
                  type: string
              type: object
            request_id:
              type: string
            server_time:
              type: string
          type: object
        ok:
          type: boolean
      required:
        - ok
        - code
        - message
        - data
        - meta
      type: object
  - name: getAgencyHistory
    description: 单个匿名机构/大V的历史评分走势（PIT） - 按日期从早到晚，返回这个匿名机构/大V每个发布日的评分。
