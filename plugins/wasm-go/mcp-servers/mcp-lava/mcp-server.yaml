  - name: listOpinionsByStock
    description: 个股消息面热度：某只股票最近被提到的记录 - 按股票查最近一段时间的消息面记录：一句话摘要、要点、涉及的股票/概念、匿名机构/大V ID 和机构/大V分；同时给出被提到几次、有多少机构/大V提到等热度数字。不含多空观点、不含原文。
    args:
      - name: days
        description: 回看天数（未给 start_date 时生效）
        type: integer
        position: query
      - name: end_date
        description: 结束日期 YYYY-MM-DD，默认今天；区间最长 92 天
        type: string
        position: query
      - name: limit
        description: 返回条数，默认 50，最大 200
        type: integer
        position: query
      - name: only_this_stock
        description: 1=只要仅涉及该股的记录；0=该股为第一提及股的记录
        type: integer
        enum:
          - 0
          - 1
        position: query
      - name: start_date
        description: 开始日期 YYYY-MM-DD
        type: string
        position: query
      - name: stock_name
        description: 股票简称（与 ts_code 二选一）
        type: string
        position: query
      - name: ts_code
        description: 股票代码，如 300750.SZ（与 stock_name 二选一）
        type: string
        position: query
    requestTemplate:
